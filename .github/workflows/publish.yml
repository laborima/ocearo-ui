name: Publish to npm and GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          NODE_ENV: production
        run: npm run build

      # READMEs for the Signal K App Store and npm: no raw HTML, images and
      # links to GitHub (docs/ is not published)
      - name: Prepare package for publishing
        run: node scripts/prepare-npm-package.mjs

      # A push without a version bump must not stop the site from deploying
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Compare the answer: some npm versions print nothing but exit 0 for
          # a version that does not exist, which skipped the 2.0.1 publish
          PUBLISHED=$(npm view "ocearo-ui@${VERSION}" version 2>/dev/null || true)
          if [ "${PUBLISHED}" = "${VERSION}" ]; then
            echo "ocearo-ui@${VERSION} is already on npm, skipping publish"
          else
            cd out
            npm publish --access public --provenance
          fi

      # The App Store's Changelog tab reads the GitHub releases: one per version,
      # with its CHANGELOG.md section (a bare tag only gives its one-line message)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists"
          else
            node scripts/release-notes.mjs "${VERSION}" > release-notes.md
            gh release create "${VERSION}" --target "${GITHUB_SHA}" --title "Ocearo UI ${VERSION}" --notes-file release-notes.md
          fi

      # The website at the root, the app (live demo) under app/. The app loads its
      # scripts from /ocearo-ui/_next (its production assetPrefix); everything else
      # it loads is relative.
      # SITE_URL: the custom domain (DNS CNAME ocearo -> laborima.github.io.). The build
      # writes the CNAME file, so each deploy keeps the domain, and
      # laborima.github.io/ocearo-ui/ redirects to it
      - name: Build website
        env:
          SITE_URL: https://ocearo.leslaborie.org
        run: node www/build.mjs

      - name: Assemble GitHub Pages
        run: |
          mkdir -p pages/app
          cp -r www/dist/. pages/
          cp -r out/. pages/app/
          # /ocearo-ui/_next: at the site root on laborima.github.io/ocearo-ui/, in an
          # ocearo-ui/ folder on a custom domain
          if [ -f pages/CNAME ]; then mkdir -p pages/ocearo-ui && mv pages/app/_next pages/ocearo-ui/_next; else mv pages/app/_next pages/_next; fi
          rm -f pages/app/package.json pages/app/README.md pages/app/README.fr.md pages/app/CHANGELOG.md

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
